name: Build unsigned IPA

# Build app iOS KHÔNG ký (unsigned) để người dùng tự ký bằng
# SideStore / ESign / AltStore với Apple ID miễn phí.
# Máy này KHÔNG có Xcode nên không build được IPA ở local —
# workflow này chạy trên máy macOS của GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "YTXTubeiOS/**"
      - "YTXTubeiOS.xcodeproj/**"

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project YTXTubeiOS.xcodeproj \
            -scheme YTXTubeiOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/YTXTubeiOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Pack unsigned IPA
        run: |
          mkdir -p Payload
          cp -r "build/YTXTubeiOS.xcarchive/Products/Applications/YTXTubeiOS.app" Payload/
          zip -r YTXTubeiOS-unsigned.ipa Payload
          ls -lh YTXTubeiOS-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTXTubeiOS-unsigned
          path: YTXTubeiOS-unsigned.ipa
          if-no-files-found: error
